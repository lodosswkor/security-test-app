      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);

    }

      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;

    }
    .report-list {
      list-style: none;

      border-radius: 8px;

    }
    .report-item:hover {
      border-color: #667eea;

    .report-item a {
      display: block;
      padding: 16px 20px;
      text-decoration: none;

    .report-item-date {
      font-size: 0.85rem;
      color: #666;
    }
    .report-item-desc {
      color: #666;
      font-size: 0.9rem;
    }
    .severity-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 6px;
    }
    .critical { background: #dc3545; color: white; }
    .high { background: #fd7e14; color: white; }
    .medium { background: #ffc107; color: #333; }
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 0.85rem;

</head>

</html>
